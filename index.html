<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 통역소</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  @font-face{
    font-family:'LotteriaChab';
    src:url('fonts/LotteriaChab.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'GriunMyoeunHeullim';
    src:url('fonts/GriunMyoeunHeullim.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'CloudSofa';
    src:url('fonts/CloudSofa-Regular.ttf') format('truetype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'OngleipParkDahyeon';
    src:url('fonts/OngleipParkDahyeon.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'DearFromsol';
    src:url('fonts/DearFromsol.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'GriunMongtori';
    src:url('fonts/GriunMongtori.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg:#eceef0;
    --surface:#ffffff;
    --surface-2:#f4f5f7;
    --ink:#14171f;
    --ink-soft:#4b5160;
    --ink-faint:#7b8191;
    --line:#d7dae0;
    --line-soft:#e4e6ea;
    --accent:#3b4cca;
    --accent-ink:#2331a6;
    --accent-soft:#e7e9fb;
    --brass:#a8792c;
    --brass-soft:#f1e6cd;
    --good:#1f7a55;
    --danger:#b4382f;
    --danger-soft:#fbe9e7;
    --shadow: 0 1px 2px rgba(20,23,31,.04), 0 8px 24px -12px rgba(20,23,31,.18);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10121a;
      --surface:#171a24;
      --surface-2:#1b1e2a;
      --ink:#edeef3;
      --ink-soft:#a6acbc;
      --ink-faint:#767c8d;
      --line:#2a2e3c;
      --line-soft:#20232f;
      --accent:#8a97ff;
      --accent-ink:#c4cbff;
      --accent-soft:#232a52;
      --brass:#e0aa55;
      --brass-soft:#372b13;
      --good:#4fd198;
      --danger:#ff8f87;
      --danger-soft:#3a1f1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    }
  }
  html[data-theme="dark"]{
    --bg:#10121a;
    --surface:#171a24;
    --surface-2:#1b1e2a;
    --ink:#edeef3;
    --ink-soft:#a6acbc;
    --ink-faint:#767c8d;
    --line:#2a2e3c;
    --line-soft:#20232f;
    --accent:#8a97ff;
    --accent-ink:#c4cbff;
    --accent-soft:#232a52;
    --brass:#e0aa55;
    --brass-soft:#372b13;
    --good:#4fd198;
    --danger:#ff8f87;
    --danger-soft:#3a1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces','Malgun Gothic',serif; text-wrap:balance; margin:0; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .page{ max-width:1080px; margin:0 auto; padding:40px 24px 64px; }

  .theme-toggle{
    position:fixed; top:20px; right:20px; z-index:20;
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow); transition:color .15s, border-color .15s;
  }
  .theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  .theme-toggle.is-dark .icon-sun{ display:none; }
  .theme-toggle.is-dark .icon-moon{ display:block; }

  header.masthead{ margin-bottom:32px; }
  .eyebrow{
    font-family:'CloudSofa','JetBrains Mono',monospace;
    font-size:20px;
    letter-spacing:.02em;
    color:#8b5cf6;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  h1.title{
    font-family:'LotteriaChab','Fraunces','Malgun Gothic',serif;
    font-size:clamp(30px,4.4vw,42px); font-weight:normal; color:var(--ink);
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  h1.title em{ font-style:normal; color:var(--accent); }
  .title-wand{
    width:1.05em; height:auto; flex:none;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));
  }
  .subtitle{
    margin-top:10px; color:var(--ink-soft);
    font-family:'OngleipParkDahyeon','Work Sans','Malgun Gothic',sans-serif;
    font-size:19px; line-height:1.5; white-space:nowrap;
  }
  @media (max-width:760px){
    .subtitle{ white-space:normal; word-break:keep-all; }
  }

  .layout{ display:grid; grid-template-columns:380px 1fr; gap:22px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }
  .results-col{ display:flex; flex-direction:column; gap:22px; min-width:0; }

  .panel{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    font-family:'DearFromsol','Work Sans','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  .panel h2{ font-family:'DearFromsol','Malgun Gothic',serif; font-weight:normal; }

  .panel-badge{
    position:absolute; top:0; left:24px; transform:translateY(-50%);
    display:inline-flex; align-items:center;
    padding:7px 20px; border-radius:999px;
    background:var(--accent-soft); border:1px solid var(--accent);
    color:var(--accent-ink);
    font-family:'GriunMongtori','Malgun Gothic',serif;
    font-size:18px; font-weight:normal; white-space:nowrap;
  }

  .desk{ padding:38px 22px 20px; position:sticky; top:20px; }
  @media (max-width:860px){ .desk{ position:static; } }
  .desk .desk-sub{ color:var(--ink-faint); font-size:13px; margin-bottom:18px; }

  label.field-label{
    display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    letter-spacing:.02em; margin-bottom:6px;
  }
  .field{ margin-bottom:18px; }
  textarea, input[type="text"]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    resize:vertical;
    transition:border-color .15s;
  }
  textarea{ min-height:88px; }
  textarea:hover, input[type="text"]:hover{ border-color:var(--ink-faint); }
  textarea:focus, input[type="text"]:focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  textarea::placeholder, input::placeholder{ color:var(--ink-faint); }

  .file-row{ display:flex; align-items:center; gap:8px; }
  input[type="file"]{
    flex:1; min-width:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12.5px;
  }
  input[type="file"]::file-selector-button{
    margin-right:10px; padding:6px 12px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:12.5px; cursor:pointer;
  }
  input[type="file"]::file-selector-button:hover{ border-color:var(--accent); color:var(--accent); }
  .file-clear-btn{
    flex:none; background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:12px; padding:8px 12px; border-radius:9px; cursor:pointer;
  }
  .file-clear-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .file-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.4; }

  .toggle-row{
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
    padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
  }
  .toggle-row input{ accent-color:var(--accent); width:16px; height:16px; margin:0; }
  .toggle-row label{ font-size:13.5px; color:var(--ink-soft); cursor:pointer; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
  .chip{ position:relative; }
  .chip input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .chip span{
    display:inline-flex; align-items:center; gap:5px;
    padding:6px 11px; border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface-2);
    font-size:12.5px; color:var(--ink-soft);
    cursor:pointer; transition:all .12s;
    user-select:none;
  }
  .chip input:checked + span{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .chip input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:2px; }
  .chip:hover span{ border-color:var(--accent); }

  .cat-tabs{ display:flex; gap:5px; margin-bottom:12px; }
  .cat-tab{
    flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:4px;
    padding:9px 4px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-soft); font-family:inherit;
    font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer; transition:all .12s;
  }
  .cat-tab:hover{ border-color:var(--accent); }
  .cat-tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .cat-tab .count{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500;
    background:var(--accent-soft); color:var(--accent-ink); border-radius:999px; padding:1px 5px;
  }
  .cat-tab.active .count{ background:rgba(255,255,255,.28); color:#fff; }

  .picked{ margin-top:16px; }
  .picked-label{
    font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:7px;
  }
  .picked-empty{ font-size:12.5px; color:var(--ink-faint); }
  .picked-pills{ display:flex; flex-wrap:wrap; gap:6px; }
  .picked-pill{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--accent-soft); color:var(--accent-ink);
    border-radius:999px; padding:5px 4px 5px 11px; font-size:12px; font-weight:600;
  }
  .picked-pill button{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:17px; height:17px; border-radius:50%; color:var(--accent-ink); font-size:13px; line-height:1;
  }
  .picked-pill button:hover{ background:rgba(0,0,0,.08); }

  .mode-tabs{
    display:flex; gap:6px; margin-bottom:18px; padding:4px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  }
  .mode-tab{
    flex:1 1 0; padding:9px 10px; border-radius:8px; border:none; background:transparent;
    color:var(--ink-soft); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .12s;
  }
  .mode-tab:hover{ color:var(--ink); }
  .mode-tab.active{ background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow); }

  .warn{ font-size:12.5px; color:var(--danger); margin-top:8px; min-height:16px; }

  .submit-btn{
    width:100%; margin-top:14px;
    background:var(--accent); color:#fff; border:none;
    padding:12px 16px; border-radius:9px;
    font-size:14.5px; font-weight:600; font-family:inherit;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s;
  }
  .submit-btn:hover{ background:var(--accent-ink); }
  .submit-btn:disabled{ background:var(--ink-faint); cursor:not-allowed; }
  .stop-btn{
    width:100%; margin-top:8px; background:transparent; border:1px solid var(--line);
    color:var(--ink-soft); padding:9px 16px; border-radius:9px; font-family:inherit;
    font-size:13px; cursor:pointer;
  }
  .stop-btn:hover{ border-color:var(--danger); color:var(--danger); }

  .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }

  .results{ padding:38px 22px 20px; min-height:200px; }
  .results-head{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .sample-flag{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em;
    color:var(--brass); background:var(--brass-soft); padding:4px 9px; border-radius:6px;
    text-transform:uppercase;
  }
  .status-flag{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em;
    color:var(--good); background:transparent; padding:4px 0; text-transform:uppercase;
  }

  .banner{
    font-size:13px; color:var(--ink-soft); background:var(--surface-2);
    border:1px solid var(--line); border-radius:9px; padding:10px 13px; margin-bottom:16px;
  }
  .banner strong{ color:var(--ink); }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:6px; padding:56px 20px; color:var(--ink-faint);
    border:1px dashed var(--line); border-radius:12px;
  }
  .empty-state strong{ color:var(--ink-soft); font-size:14.5px; font-weight:600; }
  .empty-state span{ font-size:13px; max-width:36ch; line-height:1.5; }

  .tickets{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }

  .ticket{
    border:1px solid var(--line); border-radius:12px; background:var(--surface-2);
    padding:16px 16px 14px; position:relative; overflow:hidden;
  }
  .ticket.pending{ opacity:.6; }
  .ticket-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .ticket-plat{ font-weight:600; font-size:15px; }
  .ticket-group{ font-size:11px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:2px; }
  .stamp{
    flex:none; width:44px; height:44px; border-radius:50%;
    border:1.5px dashed var(--brass); color:var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.02em;
    text-align:center; transform:rotate(-8deg); line-height:1.15; flex-wrap:wrap;
  }
  .ticket-body{
    font-family:'JetBrains Mono',monospace; font-size:12.3px; line-height:1.55;
    color:var(--ink); background:var(--surface); border:1px solid var(--line-soft);
    border-radius:8px; padding:11px 12px; white-space:pre-wrap; word-break:break-word;
    max-height:220px; overflow-y:auto; margin-bottom:10px;
  }
  .ticket-body.skeleton{ color:transparent; }
  .skeleton-line{ height:10px; background:var(--line-soft); border-radius:4px; margin-bottom:7px; }
  .skeleton-line:nth-child(2){ width:85%; }
  .skeleton-line:nth-child(3){ width:60%; }

  .perf{ border-top:1px dashed var(--line); margin:0 -16px 10px; }
  .ticket-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .dialect{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; max-width:68%; }
  .copy-btn{
    flex:none; display:flex; align-items:center; gap:5px;
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:12px; padding:6px 10px; border-radius:7px; cursor:pointer;
  }
  .copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .copy-btn.copied{ border-color:var(--good); color:var(--good); }
  .copy-btn svg{ width:12px; height:12px; }

  .error-note{
    font-size:13px; color:var(--danger); background:var(--danger-soft);
    border:1px solid var(--danger); border-radius:9px; padding:11px 13px; margin-bottom:14px;
  }
  .retry-btn{
    margin-top:8px; background:var(--danger); color:#fff; border:none;
    padding:7px 13px; border-radius:7px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }

  .history{ padding:32px 22px 26px; }
  .history-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .history-sub{ font-size:12.5px; color:var(--ink-faint); }
  .history-clear-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:12px; padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .history-clear-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .history-empty{ font-size:13px; color:var(--ink-faint); padding:22px 0; text-align:center; }
  .history-list{ display:flex; flex-direction:column; gap:10px; }
  .history-item{ border:1px solid var(--line); border-radius:11px; background:var(--surface-2); padding:13px 14px; }
  .history-item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .history-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .history-mode{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:999px;
  }
  .history-time{ font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; }
  .history-summary{ font-size:13.5px; color:var(--ink); line-height:1.5; word-break:break-word; }
  .history-platforms{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
  .history-actions{ display:flex; align-items:center; gap:6px; flex:none; }
  .history-toggle-btn, .history-del-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:11.5px; padding:5px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  }
  .history-toggle-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .history-del-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .history-detail{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }

  footer.fine{ margin-top:26px; font-size:12px; color:var(--ink-faint); text-align:center; }
</style>
<script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch(e) {}
  })();
</script>
</head>
<body>
<div class="page">
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="화면 테마 전환">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <header class="masthead">
    <div class="eyebrow">Prompt Factory</div>
    <h1 class="title">뚝딱뚝딱 <em>프롬프트</em><img class="title-wand" src="assets/wand.png" alt="" width="260" height="255"></h1>
    <p class="subtitle">하고 싶은 것을 한 번만 적으면, 이미지·영상·음악·텍스트 생성 AI마다 다른 프롬프트 문법에 맞춰 만들어 드립니다.</p>
  </header>

  <div class="layout">
    <div class="panel desk">

        </div>

        <div class="field">
          <label class="field-label" for="char-style">어떤 스타일/세계관으로 만들까요?</label>
          <input id="char-style" list="char-style-options" type="text" maxlength="200" placeholder="예: 메이플스토리 도트 아바타" value="메이플스토리 도트 아바타">
          <datalist id="char-style-options">
            <option value="메이플스토리 도트 아바타">
            <option value="포켓몬풍 캐릭터">
            <option value="지브리풍 캐릭터">
            <option value="디즈니 픽사 3D 캐릭터">
            <option value="심슨 가족 스타일">
            <option value="2000년대 일본 TV 애니메이션 마스코트">

        <label class="field-label">어떤 AI에서 사용할까요?</label>

    <div class="results-col">

      <div class="panel history">

          <button type="button" class="history-clear-btn" id="history-clear-btn" hidden>전체 삭제</button>
        </div>
        <div id="history-body"></div>
      </div>

  </div>

  <footer class="fine">입력한 내용은 서버에 저장되지 않으며, 요청 처리를 위해 Google Gemini API로 전달됩니다.</footer>
</div>

<script>
(function(){
  var root = document.documentElement;
  var themeToggle = document.getElementById('theme-toggle');

  function activeTheme(){
    var attr = root.getAttribute('data-theme');
    if (attr === 'light' || attr === 'dark') return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function syncToggleIcon(){
    themeToggle.classList.toggle('is-dark', activeTheme() === 'dark');
  }
  syncToggleIcon();

  themeToggle.addEventListener('click', function(){
    var next = activeTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
    syncToggleIcon();
  });

  var darkMedia = window.matchMedia('(prefers-color-scheme: dark)');
  darkMedia.addEventListener('change', function(){
    if (!root.getAttribute('data-theme')) syncToggleIcon();
  });
})();

(function(){
  const PLATFORMS = [
    { id:'midjourney', group:'이미지', label:'Midjourney', dialect:'쉼표로 나열한 키워드 + --ar, --v 같은 파라미터', stamp:'IMG' },
    { id:'dalle',      group:'이미지', label:'DALL·E / GPT 이미지', dialect:'장면을 그대로 서술하는 자연어 문장', stamp:'IMG' },
    { id:'sdxl',       group:'이미지', label:'Stable Diffusion', dialect:'주제·스타일·품질 태그 + negative prompt', stamp:'IMG' },
    { id:'firefly',    group:'이미지', label:'Adobe Firefly', dialect:'자연어 설명 + 효과·스타일 키워드', stamp:'IMG' },
    { id:'sora',       group:'영상', label:'Sora', dialect:'카메라 워크를 포함한 영화적 지문', stamp:'VID' },
    { id:'runway',     group:'영상', label:'Runway Gen-3', dialect:'샷 구성과 카메라 움직임을 짧은 문장으로', stamp:'VID' },
    { id:'kling',      group:'영상', label:'Kling', dialect:'동작·전개 중심의 시네마틱 문장', stamp:'VID' },
    { id:'suno',       group:'음악', label:'Suno', dialect:'[Verse]/[Chorus] 구조 태그 + 장르·악기 스타일 태그', stamp:'AUD' },
    { id:'udio',       group:'음악', label:'Udio', dialect:'장르·무드·보컬 스타일을 짧은 태그로 나열', stamp:'AUD' },
    { id:'chatgpt',    group:'텍스트', label:'ChatGPT', dialect:'역할·맥락·출력형식을 갖춘 지시문', stamp:'TXT' },
    { id:'claude',     group:'텍스트', label:'Claude', dialect:'명확한 역할과 단계별 지시, 출력 형식 지정', stamp:'TXT' },
    { id:'gemini',     group:'텍스트', label:'Gemini', dialect:'목표와 제약을 명시한 구조화 지시문', stamp:'TXT' },
  ];
  const GROUP_ORDER = ['이미지','영상','음악','텍스트'];
  const DEFAULT_SELECTED = [];

  const catTabsEl = document.getElementById('cat-tabs');
  const chipListEl = document.getElementById('chip-list');
  const pickedPillsEl = document.getElementById('picked-pills');
  const warnEl = document.getElementById('warn');
  const submitBtn = document.getElementById('submit-btn');
  const stopBtn = document.getElementById('stop-btn');
  const resultsBody = document.getElementById('results-body');
  const resultsFlag = document.getElementById('results-flag');
  const resultsTitleEl = document.getElementById('results-title');
  const ideaEl = document.getElementById('idea');
  const styleEl = document.getElementById('style');
  const englishEl = document.getElementById('english');
  const refFileEl = document.getElementById('ref-file');
  const refFileClearBtn = document.getElementById('ref-file-clear');
  const refFileWarnEl = document.getElementById('ref-file-warn');

  const REF_FILE_MAX_BYTES = 3 * 1024 * 1024;
  const REF_FILE_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'application/pdf'];

  refFileEl.addEventListener('change', () => {
    refFileWarnEl.textContent = '';
    const file = refFileEl.files && refFileEl.files[0];
    if (!file){ refFileClearBtn.hidden = true; return; }
    if (!REF_FILE_TYPES.includes(file.type)){
      refFileWarnEl.textContent = 'PNG, JPG, WEBP 이미지 또는 PDF 파일만 올릴 수 있어요.';
      refFileEl.value = '';
      refFileClearBtn.hidden = true;
      return;
    }
    if (file.size > REF_FILE_MAX_BYTES){
      refFileWarnEl.textContent = '파일이 너무 커요. 3MB 이하 파일로 올려주세요.';
      refFileEl.value = '';
      refFileClearBtn.hidden = true;
      return;
    }
    refFileClearBtn.hidden = false;
  });

  refFileClearBtn.addEventListener('click', () => {
    refFileEl.value = '';
    refFileClearBtn.hidden = true;
    refFileWarnEl.textContent = '';
  });

  function readFileAsBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result || '';
        const comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : result);
      };
      reader.onerror = () => reject(reader.error || new Error('파일을 읽지 못했어요.'));
      reader.readAsDataURL(file);
    });
  }

  const modeTabsEl = document.getElementById('mode-tabs');
  const panelGeneralEl = document.getElementById('panel-general');
  const panelCharacterEl = document.getElementById('panel-character');
  const charSubjectEl = document.getElementById('char-subject');
  const charStyleEl = document.getElementById('char-style');
  const charTargetTabsEl = document.getElementById('char-target-tabs');
  const charBannerEl = document.getElementById('char-banner');
  const charWarnEl = document.getElementById('char-warn');
  const charSubmitBtn = document.getElementById('char-submit-btn');

  const CHAR_TARGETS = [
    { id:'chatgpt', label:'ChatGPT', stamp:'IMG', banner:'이 프롬프트는 사진을 함께 첨부했을 때 가장 잘 작동해요. ChatGPT에서 변환하고 싶은 사진을 먼저 올린 뒤, 생성된 프롬프트를 이어서 붙여넣으세요.' },
    { id:'gemini',  label:'Gemini',  stamp:'IMG', banner:'이 프롬프트는 사진을 함께 첨부했을 때 가장 잘 작동해요. Gemini 앱에서 변환하고 싶은 사진을 먼저 올린 뒤, 생성된 프롬프트를 이어서 붙여넣으세요.' },
    { id:'claude',  label:'Claude',  stamp:'IMG', banner:'이 프롬프트는 사진을 함께 첨부했을 때 가장 잘 작동해요. Claude에서 변환하고 싶은 사진을 먼저 올린 뒤, 생성된 프롬프트를 이어서 붙여넣으세요.' },
  ];
  let charTarget = CHAR_TARGETS[0].id;

  function getCharTarget(){
    return CHAR_TARGETS.find(t => t.id === charTarget) || CHAR_TARGETS[0];
  }

  function renderCharTargetTabs(){
    charTargetTabsEl.innerHTML = '';
    CHAR_TARGETS.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-tab' + (t.id === charTarget ? ' active' : '');
      btn.textContent = t.label;
      btn.addEventListener('click', () => {
        charTarget = t.id;
        renderCharTargetTabs();
        charBannerEl.innerHTML = '<strong>참고.</strong> ' + t.banner;
      });
      charTargetTabsEl.appendChild(btn);
    });
  }
  renderCharTargetTabs();
  charBannerEl.innerHTML = '<strong>참고.</strong> ' + getCharTarget().banner;
  const charStopBtn = document.getElementById('char-stop-btn');

  const selectedIds = new Set(DEFAULT_SELECTED);
  let activeGroup = GROUP_ORDER[0];

  function countInGroup(group){
    return PLATFORMS.filter(p => p.group === group && selectedIds.has(p.id)).length;
  }

  function renderTabs(){
    catTabsEl.innerHTML = '';
    GROUP_ORDER.forEach(group => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-tab' + (group === activeGroup ? ' active' : '');
      const count = countInGroup(group);
      btn.innerHTML = group + (count ? ' <span class="count">' + count + '</span>' : '');
      btn.addEventListener('click', () => {
        activeGroup = group;
        renderTabs();
        renderChips();
      });
      catTabsEl.appendChild(btn);
    });
  }

  function renderChips(){
    chipListEl.innerHTML = '';
    PLATFORMS.filter(p => p.group === activeGroup).forEach(p => {
      const label = document.createElement('label');
      label.className = 'chip';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = p.id;
      input.name = 'platform';
      input.checked = selectedIds.has(p.id);
      input.addEventListener('change', () => {
        if (input.checked) selectedIds.add(p.id); else selectedIds.delete(p.id);
        renderTabs();
        renderPicked();
      });
      const span = document.createElement('span');
      span.textContent = p.label;
      label.appendChild(input);
      label.appendChild(span);
      chipListEl.appendChild(label);
    });
  }

  function renderPicked(){
    const chosen = PLATFORMS.filter(p => selectedIds.has(p.id));
    if (chosen.length === 0){
      pickedPillsEl.innerHTML = '<div class="picked-empty">아직 선택된 AI가 없어요. 위에서 하나 이상 골라주세요.</div>';
      return;
    }
    pickedPillsEl.innerHTML = '';
    pickedPillsEl.className = 'picked-pills';
    chosen.forEach(p => {
      const pill = document.createElement('span');
      pill.className = 'picked-pill';
      const text = document.createElement('span');
      text.textContent = p.label;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', p.label + ' 선택 해제');
      btn.textContent = '×';
      btn.addEventListener('click', () => {
        selectedIds.delete(p.id);
        renderTabs();
        if (p.group === activeGroup) renderChips();
        renderPicked();
      });
      pill.appendChild(text);
      pill.appendChild(btn);
      pickedPillsEl.appendChild(pill);
    });
  }

  renderTabs();
  renderChips();
  renderPicked();

  function selectedPlatforms(){
    return PLATFORMS.filter(p => selectedIds.has(p.id));
  }

  function copyIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2" fill="none"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none"/></svg>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function ticketMarkup(p, promptText, pending){
    const body = pending
      ? '<div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>'
      : escapeHtml(promptText);
    return (
      '<div class="ticket' + (pending ? ' pending' : '') + '" data-id="' + p.id + '">' +
        '<div class="ticket-top">' +
          '<div><div class="ticket-plat">' + p.label + '</div><div class="ticket-group">' + p.group + '</div></div>' +
          '<div class="stamp">' + p.stamp + '</div>' +
        '</div>' +
        '<div class="ticket-body' + (pending ? ' skeleton' : '') + '">' + body + '</div>' +
        '<div class="perf"></div>' +
        '<div class="ticket-foot">' +
          '<div class="dialect">' + p.dialect + '</div>' +
          (pending ? '' : '<button class="copy-btn" type="button">' + copyIcon() + '<span>복사</span></button>') +
        '</div>' +
      '</div>'
    );
  }

  function renderExample(){
    resultsFlag.hidden = true;
    resultsBody.innerHTML =
      '<div class="empty-state">' +
        '<strong>아직 만들어진 프롬프트가 없어요</strong>' +
        '<span>왼쪽 접수대에 내용을 적고 AI를 하나 이상 선택한 뒤 "프롬프트 생성하기"를 누르면 결과가 여기에 표시돼요.</span>' +
      '</div>';
  }

  function renderPending(platforms){
    resultsFlag.hidden = false;
    resultsFlag.textContent = '생성 중';
    resultsFlag.className = 'status-flag';
    resultsBody.innerHTML = '<div class="tickets">' + platforms.map(p => ticketMarkup(p, '', true)).join('') + '</div>';
  }

  function renderResults(platforms, byId){
    resultsFlag.hidden = false;
    resultsFlag.textContent = '완료';
    resultsFlag.className = 'status-flag';
    resultsBody.innerHTML = '<div class="tickets">' + platforms.map(p =>
      ticketMarkup(p, byId[p.id] || '(응답에 이 플랫폼의 결과가 없습니다)', false)
    ).join('') + '</div>';
    wireCopyButtons();
  }

  function renderError(message, retryable){
    resultsFlag.hidden = false;
    resultsFlag.textContent = '오류';
    resultsFlag.className = 'status-flag';
    resultsBody.innerHTML =
      '<div class="error-note">' + escapeHtml(message) +
        (retryable ? '<div><button class="retry-btn" id="retry-btn" type="button">다시 시도</button></div>' : '') +
      '</div>';
    if (retryable){
      const btn = document.getElementById('retry-btn');
      if (btn) btn.addEventListener('click', runGeneration);
    }
  }

  function wireCopyButtons(container){
    (container || resultsBody).querySelectorAll('.ticket').forEach(ticket => {
      const btn = ticket.querySelector('.copy-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const text = ticket.querySelector('.ticket-body').textContent;
        try {
          await navigator.clipboard.writeText(text);
          btn.classList.add('copied');
          btn.querySelector('span').textContent = '복사됨';
          setTimeout(() => { btn.classList.remove('copied'); btn.querySelector('span').textContent = '복사'; }, 1600);
        } catch(e) {
          btn.querySelector('span').textContent = '복사 실패';
        }
      });
    });
  }

  function renderCharacterExample(){
    resultsFlag.textContent = '예시';
    resultsFlag.className = 'sample-flag';
    resultsBody.innerHTML =
      '<div class="banner"><strong>안내.</strong> 왼쪽에 변환할 캐릭터·사진과 원하는 스타일을 적고 "프롬프트 만들기"를 누르면, 아래와 같은 구조의 상세한 변환 프롬프트가 만들어집니다.</div>' +
      '<div class="ticket">' +
        '<div class="ticket-top">' +
          '<div><div class="ticket-plat">ChatGPT 이미지</div><div class="ticket-group">캐릭터 변환</div></div>' +
          '<div class="stamp">IMG</div>' +
        '</div>' +
        '<div class="ticket-body">역할 정의 — 당신은 [스타일] 전문 아트 디렉터다\n\n[입력]\n캐릭터명 또는 사진 첨부\n\n[작업]\n원본 특징 분석 (헤어·색상·표정·의상 등)\n\n[스타일 SPEC]\n목표 세계관의 구조·비율·채색 규칙\n\n[출력 조건]\n정사각형, 단색 배경, 인물 단독, 프로필용 구도\n\n[절대 금지]\n혼동되기 쉬운 다른 스타일·요소 나열</div>' +
        '<div class="perf"></div>' +
        '<div class="ticket-foot"><div class="dialect">역할 정의 → 입력 → 분석 → 스타일 규격 → 출력 조건 → 금지 목록 순으로 구성됩니다</div></div>' +
      '</div>';
  }

  function renderCharacterPending(){
    resultsFlag.textContent = '생성 중';
    resultsFlag.className = 'status-flag';
    const t = getCharTarget();
    resultsBody.innerHTML = '<div class="tickets">' +
      '<div class="ticket pending">' +
        '<div class="ticket-top"><div><div class="ticket-plat">' + t.label + '</div><div class="ticket-group">캐릭터 변환</div></div><div class="stamp">' + t.stamp + '</div></div>' +
        '<div class="ticket-body skeleton"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>' +
      '</div>' +
    '</div>';
  }

  function renderCharacterResult(text){
    resultsFlag.textContent = '완료';
    resultsFlag.className = 'status-flag';
    const t = getCharTarget();
    resultsBody.innerHTML = '<div class="tickets">' +
      '<div class="ticket" data-id="char-result">' +
        '<div class="ticket-top"><div><div class="ticket-plat">' + t.label + '</div><div class="ticket-group">캐릭터 변환</div></div><div class="stamp">' + t.stamp + '</div></div>' +
        '<div class="ticket-body">' + escapeHtml(text) + '</div>' +
        '<div class="perf"></div>' +
        '<div class="ticket-foot"><div class="dialect">사진을 첨부한 뒤 이 프롬프트를 이어서 붙여넣으세요</div><button class="copy-btn" type="button">' + copyIcon() + '<span>복사</span></button></div>' +
      '</div>' +
    '</div>';
    wireCopyButtons();
  }

  function renderCharacterError(message, retryable){
    resultsFlag.textContent = '오류';
    resultsFlag.className = 'status-flag';
    resultsBody.innerHTML =
      '<div class="error-note">' + escapeHtml(message) +
        (retryable ? '<div><button class="retry-btn" id="char-retry-btn" type="button">다시 시도</button></div>' : '') +
      '</div>';
    if (retryable){
      const btn = document.getElementById('char-retry-btn');
      if (btn) btn.addEventListener('click', runCharacterGeneration);
    }
  }

  function setMode(newMode){
    modeTabsEl.querySelectorAll('.mode-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === newMode);
    });
    panelGeneralEl.hidden = newMode !== 'general';
    panelCharacterEl.hidden = newMode !== 'character';
    if (newMode === 'general'){
      resultsTitleEl.textContent = '생성 결과';
      renderExample();
    } else {
      resultsTitleEl.textContent = '생성된 프롬프트';
      renderCharacterExample();
    }
  }

  modeTabsEl.querySelectorAll('.mode-tab').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  setMode('general');

  let currentController = null;

  function setBusy(isBusy){
    submitBtn.disabled = isBusy;
    submitBtn.innerHTML = isBusy ? '<span class="spinner"></span> 생성 중…' : '프롬프트 생성하기';
    stopBtn.hidden = !isBusy;
  }

  async function runGeneration(){
    warnEl.textContent = '';
    const idea = ideaEl.value.trim();
    const style = styleEl.value.trim();
    const platforms = selectedPlatforms();

    if (!idea){
      warnEl.textContent = '무엇을 만들고 싶은지 먼저 적어주세요.';
      ideaEl.focus();
      return;
    }
    if (platforms.length === 0){
      warnEl.textContent = '생성할 AI를 하나 이상 선택해주세요.';
      return;
    }

    let attachment = null;
    const refFile = refFileEl.files && refFileEl.files[0];
    if (refFile){
      try {
        attachment = { mimeType: refFile.type, data: await readFileAsBase64(refFile) };
      } catch(e) {
        warnEl.textContent = '첨부 파일을 읽는 중 문제가 발생했어요. 다시 시도해주세요.';
        return;
      }
    }

    renderPending(platforms);
    setBusy(true);
    currentController = new AbortController();

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idea,
          style,
          useEnglish: englishEl.checked,
          platforms: platforms.map(p => ({ id: p.id, label: p.label, dialect: p.dialect })),
          attachment,
        }),
        signal: currentController.signal,
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok){
        renderError(data.error || '생성 중 문제가 발생했어요. 다시 시도해주세요.', true);
        return;
      }

      const byId = {};
      (data.results || []).forEach(row => {
        if (row && typeof row.id === 'string' && typeof row.prompt === 'string'){
          byId[row.id] = row.prompt;
        }
      });
      renderResults(platforms, byId);

      const historyItems = platforms
        .map(p => ({ id:p.id, label:p.label, group:p.group, dialect:p.dialect, stamp:p.stamp, prompt: byId[p.id] || '' }))
        .filter(it => it.prompt);
      if (historyItems.length){
        addHistoryEntry({
          id: makeId(),
          mode: 'general',
          createdAt: Date.now(),
          idea, style,
          items: historyItems,
        });
      }
    } catch(e) {
      if (e && e.name === 'AbortError'){
        renderExample();
      } else {
        renderError('네트워크 오류가 발생했어요. 연결을 확인하고 다시 시도해주세요.', true);
      }
    } finally {
      setBusy(false);
      currentController = null;
    }
  }

  submitBtn.addEventListener('click', runGeneration);
  stopBtn.addEventListener('click', () => { if (currentController) currentController.abort(); });

  let charController = null;

  function setCharBusy(isBusy){
    charSubmitBtn.disabled = isBusy;
    charSubmitBtn.innerHTML = isBusy ? '<span class="spinner"></span> 생성 중…' : '프롬프트 만들기';
    charStopBtn.hidden = !isBusy;
  }

  async function runCharacterGeneration(){
    charWarnEl.textContent = '';
    const subject = charSubjectEl.value.trim();
    const styleWorld = charStyleEl.value.trim();

    if (!subject){
      charWarnEl.textContent = '변환할 캐릭터나 사진에 대한 설명을 먼저 적어주세요.';
      charSubjectEl.focus();
      return;
    }
    if (!styleWorld){
      charWarnEl.textContent = '원하는 스타일/세계관을 적어주세요.';
      charStyleEl.focus();
      return;
    }

    renderCharacterPending();
    setCharBusy(true);
    charController = new AbortController();

    try {
      const res = await fetch('/api/character', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, styleWorld, target: charTarget }),
        signal: charController.signal,
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok){
        renderCharacterError(data.error || '생성 중 문제가 발생했어요. 다시 시도해주세요.', true);
        return;
      }
      if (!data.prompt){
        renderCharacterError('결과를 받지 못했어요. 다시 시도해주세요.', true);
        return;
      }
      renderCharacterResult(data.prompt);

      const t = getCharTarget();
      addHistoryEntry({
        id: makeId(),
        mode: 'character',
        createdAt: Date.now(),
        subject, styleWorld,
        item: { label: t.label, stamp: t.stamp, prompt: data.prompt },
      });
    } catch(e) {
      if (e && e.name === 'AbortError'){
        renderCharacterExample();
      } else {
        renderCharacterError('네트워크 오류가 발생했어요. 연결을 확인하고 다시 시도해주세요.', true);
      }
    } finally {
      setCharBusy(false);
      charController = null;
    }
  }

  charSubmitBtn.addEventListener('click', runCharacterGeneration);
  charStopBtn.addEventListener('click', () => { if (charController) charController.abort(); });

  const HISTORY_KEY = 'promptFactoryHistory';
  const HISTORY_LIMIT = 30;
  const historyBody = document.getElementById('history-body');
  const historyClearBtn = document.getElementById('history-clear-btn');

  function makeId(){
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  }

  function loadHistory(){
    try {
      const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch(e) { return []; }
  }

  function saveHistory(list){
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }

  function addHistoryEntry(entry){
    const list = loadHistory();
    list.unshift(entry);
    saveHistory(list.slice(0, HISTORY_LIMIT));
    renderHistory();
  }

  function removeHistoryEntry(id){
    saveHistory(loadHistory().filter(e => e.id !== id));
    renderHistory();
  }

  function formatHistoryTime(ts){
    try {
      return new Date(ts).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    } catch(e) { return ''; }
  }

  function historySummary(entry){
    if (entry.mode === 'character'){
      return escapeHtml(entry.subject) + ' → ' + escapeHtml(entry.styleWorld);
    }
    return escapeHtml(entry.idea) + (entry.style ? ' · ' + escapeHtml(entry.style) : '');
  }

  function historyPlatformLabels(entry){
    return entry.mode === 'character' ? entry.item.label : entry.items.map(it => it.label).join(', ');
  }

  function historyTicketMarkup(label, group, stamp, promptText, dialect){
    return (
      '<div class="ticket">' +
        '<div class="ticket-top">' +
          '<div><div class="ticket-plat">' + escapeHtml(label) + '</div><div class="ticket-group">' + escapeHtml(group) + '</div></div>' +
          '<div class="stamp">' + stamp + '</div>' +
        '</div>' +
        '<div class="ticket-body">' + escapeHtml(promptText) + '</div>' +
        '<div class="perf"></div>' +
        '<div class="ticket-foot">' +
          '<div class="dialect">' + escapeHtml(dialect) + '</div>' +
          '<button class="copy-btn" type="button">' + copyIcon() + '<span>복사</span></button>' +
        '</div>' +
      '</div>'
    );
  }

  function historyTicketsHtml(entry){
    if (entry.mode === 'character'){
      return '<div class="tickets">' + historyTicketMarkup(
        entry.item.label, '캐릭터 변환', entry.item.stamp, entry.item.prompt,
        '사진을 첨부한 뒤 이 프롬프트를 이어서 붙여넣으세요'
      ) + '</div>';
    }
    return '<div class="tickets">' + entry.items.map(it =>
      historyTicketMarkup(it.label, it.group, it.stamp, it.prompt, it.dialect)
    ).join('') + '</div>';
  }

  function renderHistory(){
    const list = loadHistory();
    historyClearBtn.hidden = list.length === 0;
    if (list.length === 0){
      historyBody.innerHTML = '<div class="history-empty">아직 저장된 생성 기록이 없어요.</div>';
      return;
    }
    historyBody.innerHTML = '<div class="history-list">' + list.map(entry => (
      '<div class="history-item" data-hid="' + entry.id + '">' +
        '<div class="history-item-top">' +
          '<div>' +
            '<div class="history-meta">' +
              '<span class="history-mode">' + (entry.mode === 'character' ? '캐릭터 프사' : '일반 생성') + '</span>' +
              '<span class="history-time">' + formatHistoryTime(entry.createdAt) + '</span>' +
            '</div>' +
            '<div class="history-summary">' + historySummary(entry) + '</div>' +
            '<div class="history-platforms">' + escapeHtml(historyPlatformLabels(entry)) + '</div>' +
          '</div>' +
          '<div class="history-actions">' +
            '<button type="button" class="history-toggle-btn">결과 보기</button>' +
            '<button type="button" class="history-del-btn" aria-label="이 기록 삭제">삭제</button>' +
          '</div>' +
        '</div>' +
        '<div class="history-detail" hidden></div>' +
      '</div>'
    )).join('') + '</div>';

    historyBody.querySelectorAll('.history-item').forEach(itemEl => {
      const id = itemEl.dataset.hid;
      const toggleBtn = itemEl.querySelector('.history-toggle-btn');
      const detailEl = itemEl.querySelector('.history-detail');
      const delBtn = itemEl.querySelector('.history-del-btn');
      toggleBtn.addEventListener('click', () => {
        const willShow = detailEl.hidden;
        if (willShow && !detailEl.dataset.rendered){
          const entry = loadHistory().find(e => e.id === id);
          if (!entry) return;
          detailEl.innerHTML = historyTicketsHtml(entry);
          wireCopyButtons(detailEl);
          detailEl.dataset.rendered = '1';
        }
        detailEl.hidden = !willShow;
        toggleBtn.textContent = willShow ? '접기' : '결과 보기';
      });
      delBtn.addEventListener('click', () => removeHistoryEntry(id));
    });
  }

  historyClearBtn.addEventListener('click', () => {
    if (!confirm('저장된 생성 기록을 모두 삭제할까요?')) return;
    saveHistory([]);
    renderHistory();
  });

  renderHistory();
})();
</script>
</body>
</html>
